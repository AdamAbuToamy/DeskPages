<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeskPages — Desktop pages for Windows 11</title>
  <meta name="description" content="Organize your Windows 11 desktop icons into pages. Explore DeskPages, view the source code, and download the Windows app on GitHub.">
  <meta name="theme-color" content="#f5f8ff">
  <link rel="canonical" href="https://adamabutoamy.github.io/DeskPages/">
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./favicon.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="DeskPages — Desktop pages for Windows 11">
  <meta property="og:description" content="A little more space for everything on your desktop. Get DeskPages on GitHub.">
  <meta property="og:url" content="https://adamabutoamy.github.io/DeskPages/">
  <meta property="og:image" content="https://adamabutoamy.github.io/DeskPages/favicon.png">
  <meta property="og:site_name" content="DeskPages">
  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "DeskPages",
  "operatingSystem": "Windows 11 x64",
  "applicationCategory": "UtilitiesApplication",
  "url": "https://adamabutoamy.github.io/DeskPages/",
  "image": "https://adamabutoamy.github.io/DeskPages/favicon.png",
  "author": {
    "@type": "Person",
    "name": "Adam Abu Toamy"
  }
}
  </script>
  <style>
    *{box-sizing:border-box}
    html{color-scheme:light}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:32px 20px;background:radial-gradient(ellipse at 50% 15%,#e5efff,transparent 65%),#f8faff;color:#172b49;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
    main{width:100%;max-width:560px;padding:48px 32px;background:#ffffffed;border:1px solid #e0e8f5;border-radius:28px;box-shadow:0 24px 80px #264b8810}
    .logo{display:block;width:112px;height:112px;margin:0 auto 24px;object-fit:contain}
    .label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:650;color:#59708f}
    h1{margin:12px 0 18px;font-size:clamp(40px,9vw,56px);line-height:1.1;letter-spacing:-.045em}
    p{margin:0 auto 30px;max-width:390px;font-size:17px;line-height:1.7;color:#566b87}
    .button{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:52px;padding:14px 25px;border-radius:13px;background:#1765df;color:#fff;text-decoration:none;font-weight:650;box-shadow:0 8px 20px #1765df24}
    .button:hover{background:#1054c1}
    a:focus-visible{outline:3px solid #172b49;outline-offset:5px}
    .note{display:block;margin-top:17px;font-size:13px;color:#6a7c94}
    footer{margin-top:38px;font-size:13px;color:#7b8ca3}
    @media(max-width:400px){main{padding:36px 22px}.logo{width:96px;height:96px}}
  </style>
</head>
<body>
  <main>
    <img class="logo" src="./favicon.png" alt="DeskPages logo" width="112" height="112">
    <div class="label">For Windows 11</div>
    <h1>DeskPages</h1>
    <p>A little more space for everything.<br>Organize your desktop icons into pages, while keeping your files in place.</p>
    <a class="button" href="https://github.com/AdamAbuToamy/DeskPages">Open on GitHub <span aria-hidden="true">↗</span></a>
    <span class="note">Downloads, source code, and setup instructions.</span>
    <footer>Created by Adam Abu Toamy</footer>
  </main>
</body>
</html>
