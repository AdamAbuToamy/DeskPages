name: Defender Windows 11 rapid diagnostic
on:
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  defender-probe:
    runs-on: windows-11-arm
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer-candidate-for-analysis
          path: candidate
          repository: AdamAbuToamy/DeskPages
          run-id: 41432372896
          github-token: ${{ github.token }}
      - name: Scan known-built installer and retain scanner output
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path defender-diagnostic | Out-Null
          $service=Get-Service WinDefend
          $status=Get-MpComputerStatus
          $status | Select-Object AMServiceEnabled,AntivirusEnabled,AntivirusSignatureVersion,AntivirusSignatureLastUpdated,AMEngineVersion | ConvertTo-Json | Set-Content defender-diagnostic/health.json
          if($service.Status -ne 'Running' -or -not $status.AntivirusEnabled){throw 'Defender service unavailable'}
          $path=(Get-ChildItem "$env:ProgramData/Microsoft/Windows Defender/Platform" -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          if(-not $path){throw 'Defender platform directory missing'}
          $scanner=Join-Path $path MpCmdRun.exe
          if($status.AntivirusSignatureLastUpdated -lt (Get-Date).AddDays(-2)){
            $updateCode=-1
            for($attempt=1;$attempt -le 6;$attempt++){
              $update=(& $scanner -SignatureUpdate -MMPC 2>&1 | Out-String)
              $updateCode=$LASTEXITCODE
              "Attempt $attempt; exit $updateCode" | Add-Content defender-diagnostic/update-output.txt
              $update | Add-Content defender-diagnostic/update-output.txt
              $status=Get-MpComputerStatus
              if($status.AntivirusSignatureLastUpdated -ge (Get-Date).AddDays(-2)){break}
              if($attempt -lt 6){Start-Sleep -Seconds 20}
            }
            if($status.AntivirusSignatureLastUpdated -lt (Get-Date).AddDays(-2)){throw "Defender signatures stale after update attempts ($updateCode)"}
            $status | Select-Object AMServiceEnabled,AntivirusEnabled,AntivirusSignatureVersion,AntivirusSignatureLastUpdated,AMEngineVersion | ConvertTo-Json | Set-Content defender-diagnostic/health-after-update.json
          }
          if($status.AntivirusSignatureLastUpdated -lt (Get-Date).AddDays(-2)){throw 'Defender signatures are stale'}
          $out=(& $scanner -Scan -ScanType 3 -DisableRemediation -File (Resolve-Path candidate).Path 2>&1 | Out-String)
          $code=$LASTEXITCODE
          $out | Set-Content defender-diagnostic/scanner-output.txt
          @{Verdict=$(if($code -eq 0){'NO_DETECTION_IN_THIS_SCAN'}else{'SCAN_ERROR_OR_DETECTION'});Code=$code} | ConvertTo-Json | Set-Content defender-diagnostic/verdict.json
          if($code -ne 0){throw "Defender scan failed with exit $code"}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: defender-fast-probe
          path: defender-diagnostic/
          if-no-files-found: warn
