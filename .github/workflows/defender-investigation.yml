name: Investigate reported Defender detection
on:
  pull_request:
    paths: ['.github/workflows/defender-investigation.yml', 'Release/Scan-Installer.ps1']
permissions:
  contents: read
  actions: read
jobs:
  scan-preserved-candidate:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download exact preserved trial candidate as data
        uses: actions/download-artifact@v4
        with:
          name: installer-candidate-for-analysis
          run-id: 39883649227
          github-token: ${{ github.token }}
          path: original-build
      - name: Verify exact SHA-256 and scan without executing the installer
        shell: powershell
        run: |
          $file='original-build/DeskPages-Setup-0.8.32.exe'
          if((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -cne '15ef0c34dae5fc222eaf308d6981656be64b855ee4c15bd7952d6dd812762b44'){throw 'Preserved candidate hash mismatch.'}
          ./Release/Scan-Installer.ps1 -Installer $file -ReportDirectory scan-report
      - name: Retain honest result even if detection or cloud validation blocks the gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preserved-candidate-defender-report
          path: scan-report/
          if-no-files-found: warn
